name: CD Tag And Release

on:
  workflow_run:
    workflows:
      - "CD Publish Unbound Manifests"
    types:
      - completed

permissions:
  actions: read
  checks: write
  contents: write

jobs:
  tag_and_release:
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411
        with:
          egress-policy: block
          allowed-endpoints: >
            api.github.com:443
            github.com:443
            raw.githubusercontent.com:443

      - name: Checkout source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
          
      - name: Download metadata artifact natively
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: unbound-build-metadata
          path: metadata
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.BOT_GITHUB_TOKEN }}

      - name: Show metadata used for this run
        run: |
          set -euo pipefail

          RUN_ID="${{ github.event.workflow_run.id }}"
          RUN_NAME="${{ github.event.workflow_run.name }}"
          RUN_CONCLUSION="${{ github.event.workflow_run.conclusion }}"

          echo "=== METADATA ==="
          printf 'Triggered by workflow run: %s\n' "${RUN_ID}"
          printf 'Upstream workflow name: %s\n' "${RUN_NAME}"
          printf 'Upstream workflow conclusion: %s\n' "${RUN_CONCLUSION}"
          echo
          echo "variant.txt:"
          cat metadata/variant.txt || echo "(missing)"
          echo
          echo "version.txt:"
          cat metadata/version.txt || echo "(missing)"
          echo "================="

      - name: Detect variant
        id: detect
        run: |
          set -euo pipefail

          if [ ! -f metadata/variant.txt ]; then
            echo "No metadata artifact found for this workflow run."
            exit 1
          fi
          
          VARIANT="$(tr -d '\n\r' < metadata/variant.txt)"

          {
            echo "VARIANT<<EOF"
            printf '%s\n' "${VARIANT}"
            echo "EOF"
          } >> "$GITHUB_ENV"
          
          if [[ "${VARIANT}" == canary* ]]; then
            echo "IS_CANARY=true" >> "$GITHUB_OUTPUT"
          else
            echo "IS_CANARY=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Verify Tag and Release eligibility
        if: ${{ steps.detect.outputs.IS_CANARY == 'true' }}
        run: |
          echo "Canary variant detected. Skipping tagging and release creations."

      - name: Import GPG key
        if: ${{ steps.detect.outputs.IS_CANARY != 'true' }}
        id: IMPORT_GPG
        uses: crazy-max/ghaction-import-gpg@2dc316deee8e90f13e1a351ab510b4d5bc0c82cd
        with:
          gpg_private_key: ${{ secrets.BOT_GPG_PRIVATE_KEY }}
          passphrase: ${{ secrets.BOT_GPG_PASSPHRASE }}
          git_user_signingkey: true
          git_commit_gpgsign: true
          git_tag_gpgsign: true
          git_push_gpgsign: false
          trust_level: 5
        env:
          GITHUB_TOKEN: ${{ secrets.BOT_GITHUB_TOKEN }}
          GH_TOKEN: ${{ secrets.BOT_GITHUB_TOKEN }}

      - name: Push tag and upload release
        if: ${{ steps.detect.outputs.IS_CANARY != 'true' }}
        env:
          GITHUB_TOKEN: ${{ secrets.BOT_GITHUB_TOKEN }}
          GIT_AUTHOR_NAME: ${{ steps.IMPORT_GPG.outputs.name }}
          GIT_AUTHOR_EMAIL: ${{ steps.IMPORT_GPG.outputs.email }}
          GIT_COMMITTER_NAME: ${{ steps.IMPORT_GPG.outputs.name }}
          GIT_COMMITTER_EMAIL: ${{ steps.IMPORT_GPG.outputs.email }}
        run: |
          set -euo pipefail
          
          git remote set-url origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}"

          VERSION="$(tr -d '\n\r' < metadata/version.txt)"
          RELEASE_TAG="v${VERSION}"
          TODAY=$(date -u +"%Y-%m-%d")
          
          PREV_TAG="$(git tag --sort=-v:refname | grep -v "^${RELEASE_TAG}$" | head -n 1 || true)"

          OLD_UNBOUND="none"
          OLD_OPENSSL="none"
          OLD_OPENSSL_QUIC="none"
          
          if [ -n "${PREV_TAG:-}" ]; then
            OLD_UNBOUND=$(git show "${PREV_TAG}:versions/unbound.txt" 2>/dev/null | tr -d '\n\r' || echo "none")
            OLD_OPENSSL=$(git show "${PREV_TAG}:versions/openssl-buildenv.txt" 2>/dev/null | grep "OPENSSL_BUILDENV_VERSION" | cut -d'=' -f2 | tr -d '\n\r' || echo "none")
            OLD_OPENSSL_QUIC=$(git show "${PREV_TAG}:versions/openssl-quic-buildenv.txt" 2>/dev/null | grep "OPENSSL_QUIC_BUILDENV_VERSION" | cut -d'=' -f2 | tr -d '\n\r' || echo "none")
            
            [ -z "${OLD_UNBOUND}" ] && OLD_UNBOUND="none"
            [ -z "${OLD_OPENSSL}" ] && OLD_OPENSSL="none"
            [ -z "${OLD_OPENSSL_QUIC}" ] && OLD_OPENSSL_QUIC="none"
          fi

          CURRENT_UNBOUND=$(tr -d '\n\r' < versions/unbound.txt 2>/dev/null || echo "none")
          CURRENT_OPENSSL=$(grep "OPENSSL_BUILDENV_VERSION" versions/openssl-buildenv.txt 2>/dev/null | cut -d'=' -f2 | tr -d '\n\r' || echo "none")
          CURRENT_OPENSSL_QUIC=$(grep "OPENSSL_QUIC_BUILDENV_VERSION" versions/openssl-quic-buildenv.txt 2>/dev/null | cut -d'=' -f2 | tr -d '\n\r' || echo "none")
          
          [ -z "${CURRENT_UNBOUND}" ] && CURRENT_UNBOUND="none"
          [ -z "${CURRENT_OPENSSL}" ] && CURRENT_OPENSSL="none"
          [ -z "${CURRENT_OPENSSL_QUIC}" ] && CURRENT_OPENSSL_QUIC="none"

          rm -f RELEASE_NOTES.md
          
          {
            printf "## %s <madnuttah-bot>\n" "${TODAY}"
            printf "\n"
            printf "### What's changed:\n\n"

            if [ "${CURRENT_UNBOUND}" != "${OLD_UNBOUND}" ] && [ "${CURRENT_UNBOUND}" != "none" ]; then
              printf "* Updated NLnet Labs Unbound to %s\n" "${CURRENT_UNBOUND}"
              printf "**Changelog:** https://github.com/NLnetLabs/unbound/releases/tag/release-%s\n\n" "${CURRENT_UNBOUND}"
            fi

            if [ "${CURRENT_OPENSSL}" != "${OLD_OPENSSL}" ] && [ "${CURRENT_OPENSSL}" != "none" ]; then
              printf "* Updated OpenSSL Buildenv to %s\n" "${CURRENT_OPENSSL}"
              printf "**Changelog:** https://github.com/madnuttah/openssl-buildenv/releases/tag/v%s\n\n" "${CURRENT_OPENSSL}"
            fi

            if [ "${CURRENT_OPENSSL_QUIC}" != "${OLD_OPENSSL_QUIC}" ] && [ "${CURRENT_OPENSSL_QUIC}" != "none" ]; then
              printf "* Updated OpenSSL+QUIC build environment to %s\n" "${CURRENT_OPENSSL_QUIC}"
              printf "**Changelog:** https://github.com/madnuttah/openssl-buildenv/releases/tag/v%s\n\n" "${CURRENT_OPENSSL_QUIC}"
            fi

            if [ "${CURRENT_UNBOUND}" = "${OLD_UNBOUND}" ] && [ "${CURRENT_OPENSSL}" = "${OLD_OPENSSL}" ] && [ "${CURRENT_OPENSSL_QUIC}" = "${OLD_OPENSSL_QUIC}" ]; then
              printf "* No component updates in this release.\n\n"
            fi

            if [ -n "${PREV_TAG:-}" ]; then
              EXISTING_EMAILS=$(git log "${PREV_TAG}" --format='%ae' 2>/dev/null | sort -u || true)
              
              BRANCH=$(git rev-parse --abbrev-ref HEAD 2>/dev/null || echo "main")
              
              PRS_JSON=$(gh pr list --base "${BRANCH}" --state merged --json author,number,headRefName,mergedAt --limit 200 2>/dev/null || echo "[]")
              
              TMP_FILE="/tmp/new_contribs_$$.txt"
              rm -f "${TMP_FILE}"
              touch "${TMP_FILE}"

              if [ "$(echo "${PRS_JSON}" | jq -r '. | length')" -gt 0 ]; then
                echo "${PRS_JSON}" | jq -c '.[]' | while read -r pr; do
                  PR_NUM=$(echo "${pr}" | jq -r '.number')
                  AUTHOR_LOGIN=$(echo "${pr}" | jq -r '.author.login')
                  
                  if [[ "${AUTHOR_LOGIN}" == *"github-actions"* ]] || \
                     [[ "${AUTHOR_LOGIN}" == *"madnuttah-bot"* ]] || \
                     [[ "${AUTHOR_LOGIN}" == *"dependabot"* ]] || \
                     [[ "${AUTHOR_LOGIN}" == *"renovate[bot]" ]]; then
                    continue
                  fi

                  AUTHOR_EMAIL=$(gh api "repos/${GITHUB_REPOSITORY}/contributors" --jq ".[] | select(.login == \"${AUTHOR_LOGIN}\") | .email" 2>/dev/null || echo "")
                  
                  if [ -z "${AUTHOR_EMAIL:-}" ]; then
                    MERGE_COMMIT=$(gh pr view "${PR_NUM}" --json mergeCommit --jq '.mergeCommit.oid' 2>/dev/null || echo "")
                    if [ -n "${MERGE_COMMIT:-}" ]; then
                      AUTHOR_EMAIL=$(git log -1 --format='%ae' "${MERGE_COMMIT}" 2>/dev/null || echo "")
                    fi
                  fi

                  IS_NEW=true
                  if [ -n "${AUTHOR_EMAIL:-}" ]; then
                    if echo "${EXISTING_EMAILS}" | grep -q "^${AUTHOR_EMAIL}$"; then
                      IS_NEW=false
                    fi
                  fi

                  if [ "${IS_NEW}" = true ]; then
                    printf "* [%s](https://github.com/%s) made their first contribution in #%s\n" "${AUTHOR_LOGIN}" "${AUTHOR_LOGIN}" "${PR_NUM}" >> "${TMP_FILE}"
                  fi
                done
              fi

              if [ -s "${TMP_FILE}" ]; then
                printf "\n### New contributors\n\n"
                cat "${TMP_FILE}"
                printf "\n"
              fi
              rm -f "${TMP_FILE}"
            fi

          } >> RELEASE_NOTES.md

          gh release create "${RELEASE_TAG}" \
            -t "${VERSION}" \
            -F RELEASE_NOTES.md \
            --latest

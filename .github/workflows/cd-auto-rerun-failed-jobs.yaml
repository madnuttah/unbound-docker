name: CD Auto-Rerun Failed Matrix Jobs

on:
  workflow_run:
    workflows:
      - "CD Build Canary Unbound Docker Image"
      - "CD Build Canary Unbound QUIC Docker Image"
      - "CD Build Unbound Docker Image"
      - "CD Build Unbound QUIC Docker Image"
    types:
      - completed

concurrency:
  group: auto-rerun-${{ github.event.workflow_run.id }}
  cancel-in-progress: false

permissions:
  actions: write
  contents: read

jobs:
  retry-failed:
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'failure' && github.event.workflow_run.head_repository.full_name == github.repository }}

    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: block
          allowed-endpoints: >
            api.github.com:443
            github.com:443

      - name: Check Retry Attempt Count
        id: check_attempts
        run: |
          set -euo pipefail

          RUN_ID="${{ github.event.workflow_run.id }}"
          REPO="${{ github.repository }}"
          MAX_RETRIES=5

          CURRENT_ATTEMPT=$(gh api "/repos/${REPO}/actions/runs/${RUN_ID}" --jq '.run_attempt')

          echo "Current run attempt: ${CURRENT_ATTEMPT}"
          echo "Max allowed attempts: ${MAX_RETRIES}"

          if [ "${CURRENT_ATTEMPT}" -ge "${MAX_RETRIES}" ]; then
            echo "will_retry=false" >> "$GITHUB_OUTPUT"
            echo "reason=Max retries (${MAX_RETRIES}) reached."
          else
            echo "will_retry=true" >> "$GITHUB_OUTPUT"
            echo "reason=Attempt ${CURRENT_ATTEMPT} < ${MAX_RETRIES}. Proceeding with rerun."
          fi
        env:
          GH_TOKEN: ${{ secrets.BOT_GITHUB_TOKEN }}

      - name: Trigger Rerun of Failed Jobs
        if: steps.check_attempts.outputs.will_retry == 'true'
        run: |
          set -euo pipefail

          RUN_ID="${{ github.event.workflow_run.id }}"
          REPO="${{ github.repository }}"
          
          echo "Waiting 15 seconds for runner state to stabilize..."
          sleep 15

          echo "Triggering rerun for failed jobs..."

          if gh api \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            -X POST \
            "/repos/${REPO}/actions/runs/${RUN_ID}/rerun-failed-jobs"; then
            echo "Rerun request sent successfully."
          else
            echo "Failed to trigger rerun."
            exit 1
          fi
        env:
          GH_TOKEN: ${{ secrets.BOT_GITHUB_TOKEN }}

      - name: Log Stop Condition
        if: steps.check_attempts.outputs.will_retry == 'false'
        run: |
          echo "STOPPED: Automatic retry limit reached."
          echo "The workflow will not retry this run anymore."
          echo "Please investigate the failure manually."

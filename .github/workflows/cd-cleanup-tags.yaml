name: CD Cleanup Dockerhub Tags

on:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:

env:
  DOCKERHUB_SLUG: "madnuttah/unbound-docker"

permissions:
  actions: read
  contents: write

jobs:
  cleanup-tags:
    
    if: github.event_name == 'workflow_dispatch'
   
    runs-on: ubuntu-latest

    env:
      DELETE_SUFFIXES: "-386 -amd64 -armv6 -armv7 -arm64 -ppc64le -s390x -riscv64"
      DRY_RUN: "false"

    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: block
          allowed-endpoints: >
            auth.docker.io:443
            github.com:443
            hub.docker.com:443
            registry-1.docker.io:443

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Login to Dockerhub
        uses: docker/login-action@371161bbe7024a29a25c5e19bfcbc0804fe9ad2c # v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Get Docker Hub JWT
        id: auth
        run: |
          token=$(curl -s -X POST https://hub.docker.com/v2/users/login/ \
            -H "Content-Type: application/json" \
            -d "{\"username\":\"${{ secrets.DOCKERHUB_USERNAME }}\",\"password\":\"${{ secrets.DOCKERHUB_TOKEN }}\"}" \
            | jq -r .token)
          if [ -z "$token" ]; then
            echo "Failed to retrieve JWT token"
            exit 1
          fi
          echo "DOCKERHUB_TOKEN_JWT=$token" >> "$GITHUB_OUTPUT"

      - name: Cleanup Tags
        env:
          REPO: ${{ env.DOCKERHUB_SLUG }}
          SUFFIXES: ${{ env.DELETE_SUFFIXES }}
          DRY_RUN: ${{ env.DRY_RUN }}
          JWT: ${{ steps.auth.outputs.DOCKERHUB_TOKEN_JWT }}
        run: |
          set -euo pipefail

          should_delete() {          
            local tag="$1"
            for s in $SUFFIXES; do
              if [[ "$tag" == *"$s" ]]; then
                return 0
              fi
            done
            return 1
          }

          delete_tag() {
            local tag="$1"
            if [ "$DRY_RUN" = "true" ]; then
              echo "[DRY-RUN] Would delete: $tag"
              return 0
            fi

            echo "Deleting tag: $tag"
            if ! curl -s -X DELETE \
              -H "Authorization: JWT $JWT" \
              "https://hub.docker.com/v2/repositories/${REPO}/tags/${tag}/" >/dev/null; then
              echo "ERROR: Failed to delete tag $tag"
              return 1
            fi
            echo "Successfully deleted: $tag"
          }

          page="https://hub.docker.com/v2/repositories/${REPO}/tags?page_size=100"
          count=0
          
          while [ -n "$page" ]; do
            body=$(curl -s "$page")

            page=$(echo "$body" | jq -r '.next // empty')

            while read -r tag; do
              [ -z "$tag" ] && continue
              
              if should_delete "$tag"; then
                delete_tag "$tag" || true
                ((count++))
              else
                echo "Skipping: $tag"
              fi
            done < <(echo "$body" | jq -r '.results // [] | .[].name // empty')
          done

          echo "Cleanup complete. Total tags processed: $count"
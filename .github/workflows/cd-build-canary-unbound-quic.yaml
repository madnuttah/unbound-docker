name: CD Build Canary Unbound QUIC Docker Image

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "versions/unbound-git-sha.txt"

permissions:
  contents: read
  packages: write

jobs:

  buildvars:
    runs-on: ubuntu-latest
    outputs:
      IMAGE_BUILD_DATE: "${{ steps.vars.outputs.IMAGE_BUILD_DATE }}"
      UNBOUND_VERSION: "${{ steps.vars.outputs.UNBOUND_VERSION }}"
      OPENSSL_QUIC_BUILDENV_VERSION: "${{ steps.vars.outputs.OPENSSL_QUIC_BUILDENV_VERSION }}"

    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@b09bb98e06d4d774595224525879c09bc6e98c40 # v2.20.1
        with:
          egress-policy: block
          allowed-endpoints: >
            api.github.com:443
            github.com:443
            nlnetlabs.nl:443
            raw.githubusercontent.com:443

      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Set buildvars
        id: vars
        run: |
          set -euo pipefail

          IMAGE_BUILD_DATE="$(date -u +"%Y-%m-%dT%H:%M:%SZ")"
          echo "IMAGE_BUILD_DATE=$IMAGE_BUILD_DATE" >> "$GITHUB_OUTPUT"

          UNBOUND_VERSION="$(
            curl -fsSL https://raw.githubusercontent.com/NLnetLabs/unbound/master/configure \
            | awk -F= '/^version=/ { print $2 }'
          )"
          echo "UNBOUND_VERSION=$UNBOUND_VERSION" >> "$GITHUB_OUTPUT"

          RESP="$(curl -fsSL https://api.github.com/repos/madnuttah/openssl-buildenv/releases)"
          echo "$RESP" | jq empty

          OPENSSL_QUIC_BUILDENV_VERSION="$(
            echo "$RESP" |
            jq -r '
              map(select(.prerelease == false and (.name | endswith("-quic"))))
              | first
              | .name
            '
          )"

          echo "OPENSSL_QUIC_BUILDENV_VERSION=$OPENSSL_QUIC_BUILDENV_VERSION" >> "$GITHUB_OUTPUT"

      - name: Show build variables
        run: |
          echo "IMAGE_BUILD_DATE=${{ steps.vars.outputs.IMAGE_BUILD_DATE }}"
          echo "UNBOUND_VERSION=${{ steps.vars.outputs.UNBOUND_VERSION }}"
          echo "OPENSSL_QUIC_BUILDENV_VERSION=${{ steps.vars.outputs.OPENSSL_QUIC_BUILDENV_VERSION }}"

  build:
    needs: buildvars
    runs-on: ubuntu-latest
    timeout-minutes: 90

    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            platform: linux/amd64
          - arch: arm64
            platform: linux/arm64
          - arch: 386
            platform: linux/386
          - arch: armv6
            platform: linux/arm/v6
          - arch: armv7
            platform: linux/arm/v7
          - arch: ppc64le
            platform: linux/ppc64le
          - arch: s390x
            platform: linux/s390x
          - arch: riscv64
            platform: linux/riscv64

    permissions:
      contents: read
      packages: write
      id-token: write

    env:
      DOCKERHUB_SLUG: "madnuttah/unbound"

    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@b09bb98e06d4d774595224525879c09bc6e98c40 # v2.20.1
        with:
          egress-policy: block
          allowed-endpoints: >
            auth.docker.io:443
            dl-cdn.alpinelinux.org:443
            github.com:443
            keyserver.ubuntu.com:443
            pgp.surf.nl:443
            nlnetlabs.nl:443
            production.cloudfront.docker.com:443
            registry-1.docker.io:443
            www.internic.net:443
            www.nlnetlabs.nl:443

      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          persist-credentials: false
          fetch-depth: 0

      - uses: docker/setup-qemu-action@06116385d9baf250c9f4dcb4858b16962ea869c3

      - uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee
        if: github.event_name != 'pull_request'
        with:
          username: "${{ secrets.DOCKERHUB_USERNAME }}"
          password: "${{ secrets.DOCKERHUB_TOKEN }}"

      - name: Build and push Unbound Canary QUIC image
        run: |
          set -euo pipefail

          BUILDER_NAME="isolated-builder-${{ github.run_id }}-${{ matrix.arch }}"
          IMAGE_TAG="${{ env.DOCKERHUB_SLUG }}:canary-quic-${{ matrix.arch }}"
          MAX_PUSH_RETRIES=3

          echo ">>> Creating builder: ${BUILDER_NAME}"
          if ! docker buildx create \
            --name "${BUILDER_NAME}" \
            --driver docker-container \
            --bootstrap \
            --use; then
            echo "ERROR: Failed to create buildx builder for ${BUILDER_NAME}"
            exit 1
          fi

          echo ">>> Building for platform: ${{ matrix.platform }}"

          if ! docker buildx build \
            --builder "${BUILDER_NAME}" \
            --file ./unbound/canary_quic.Dockerfile \
            --platform "${{ matrix.platform }}" \
            --push \
            --build-arg "IMAGE_BUILD_DATE=${{ needs.buildvars.outputs.IMAGE_BUILD_DATE }}" \
            --build-arg "OPENSSL_QUIC_BUILDENV_VERSION=${{ needs.buildvars.outputs.OPENSSL_QUIC_BUILDENV_VERSION }}" \
            --build-arg "UNBOUND_VERSION=${{ needs.buildvars.outputs.UNBOUND_VERSION }}" \
            --tag "${IMAGE_TAG}" \
            --provenance=false \
            --sbom=false \
            .; then
            
            BUILD_STATUS=$?
            echo "ERROR: Build failed for ${{ matrix.platform }}"
            echo ">>> Diagnostics after build failure:"
            docker buildx du || true
            docker ps -a || true
            docker logs "$(docker ps -a | grep buildkit | awk '{print $1}')" 2>&1 || true
            docker buildx rm "${BUILDER_NAME}" || true
            exit "${BUILD_STATUS}"
          fi

          echo ">>> Build succeeded for ${{ matrix.platform }}"

          docker buildx rm "${BUILDER_NAME}" || true

          echo ">>> Verifying image was pushed to registry..."
          VERIFY_RETRIES=0
          IMAGE_FOUND=false

          while [ "${VERIFY_RETRIES}" -lt "${MAX_PUSH_RETRIES}" ]; do
            if docker pull --quiet "${IMAGE_TAG}" &>/dev/null; then
              echo "✓ Image verified on registry: ${IMAGE_TAG}"
              IMAGE_FOUND=true
              break
            fi
            VERIFY_RETRIES=$((VERIFY_RETRIES + 1))
            if [ "${VERIFY_RETRIES}" -lt "${MAX_PUSH_RETRIES}" ]; then
              echo "Image not found yet, retry ${VERIFY_RETRIES}/${MAX_PUSH_RETRIES} in 5s..."
              sleep 5
            fi
          done

          if [ "${IMAGE_FOUND}" != "true" ]; then
            echo "ERROR: Image push failed - image not found on registry after ${MAX_PUSH_RETRIES} attempts: ${IMAGE_TAG}"
            exit 1
          fi

          echo ">>> Cleanup complete"

  upload-pipeline-metadata:
    needs: [buildvars, build]
    runs-on: ubuntu-latest

    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@b09bb98e06d4d774595224525879c09bc6e98c40 # v2.20.1
        with:
          egress-policy: block
          allowed-endpoints: >+
          
      - name: Create Isolated Metadata
        run: |
          set -euo pipefail
          mkdir -p metadata-payload
          printf "%s" "${{ needs.buildvars.outputs.UNBOUND_VERSION }}" > metadata-payload/version.txt
          printf "canary-quic" > metadata-payload/variant.txt

      - name: Upload Metadata Artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: unbound-build-metadata
          path: metadata-payload/
          retention-days: 1
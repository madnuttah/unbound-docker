name: CD Build Unbound Docker Image

on:
  push:
    branches:
      - main
    paths:
      - "versions/unbound.txt"
      - "versions/openssl-buildenv.txt"
  workflow_dispatch:

concurrency:
  group: cd-build-unbound
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  buildvars:
    if: success() && (github.actor == 'renovate[bot]' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    outputs:
      IMAGE_BUILD_DATE: "${{ steps.vars.outputs.IMAGE_BUILD_DATE }}"
      UNBOUND_VERSION: "${{ steps.vars.outputs.UNBOUND_VERSION }}"
      UNBOUND_SHA256: "${{ steps.vars.outputs.UNBOUND_SHA256 }}"
      OPENSSL_BUILDENV_VERSION: "${{ steps.vars.outputs.OPENSSL_BUILDENV_VERSION }}"
      UNBOUND_IMAGE_VERSION: "${{ steps.vars.outputs.UNBOUND_IMAGE_VERSION }}"

    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: block
          allowed-endpoints: >
            github.com:443
            nlnetlabs.nl:443

      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Load versions and fetch SHA256
        id: vars
        run: |
          set -euo pipefail

          UNBOUND_VERSION="$(cat versions/unbound.txt)"

          SHA_URL="https://nlnetlabs.nl/downloads/unbound/unbound-${UNBOUND_VERSION}.tar.gz.sha256"

          if ! curl --fail -sL "$SHA_URL" >/dev/null; then
            printf "ERROR: SHA256 file not found for %s\n" "$UNBOUND_VERSION" >&2
            exit 1
          fi

          UNBOUND_SHA256="$(curl -sL "$SHA_URL" | awk '{print $1}')"

          OPENSSL_BUILDENV_VERSION="$(grep '^OPENSSL_BUILDENV_VERSION=' versions/openssl-buildenv.txt | cut -d= -f2)"

          UNBOUND_SUB="$(
            sed -n 's/^unbound=[0-9]\{1,3\}\.[0-9]\{1,3\}\.[0-9]\{1,3\}-\([0-9]\+\)$/\1/p' \
              versions/unbound-docker-image.txt
          )"

          UNBOUND_IMAGE_VERSION="${UNBOUND_VERSION}-${UNBOUND_SUB}"

          {
            echo "IMAGE_BUILD_DATE=$(date -u +"%Y-%m-%dT%H:%M:%SZ")"
            echo "UNBOUND_VERSION=${UNBOUND_VERSION}"
            echo "UNBOUND_SHA256=${UNBOUND_SHA256}"
            echo "OPENSSL_BUILDENV_VERSION=${OPENSSL_BUILDENV_VERSION}"
            echo "UNBOUND_IMAGE_VERSION=${UNBOUND_IMAGE_VERSION}"
          } >> "$GITHUB_OUTPUT"

      - name: Show build variables
        run: |
          echo "IMAGE_BUILD_DATE=${{ steps.vars.outputs.IMAGE_BUILD_DATE }}"
          echo "UNBOUND_VERSION=${{ steps.vars.outputs.UNBOUND_VERSION }}"
          echo "UNBOUND_SHA256=${{ steps.vars.outputs.UNBOUND_SHA256 }}"
          echo "OPENSSL_BUILDENV_VERSION=${{ steps.vars.outputs.OPENSSL_BUILDENV_VERSION }}"
          echo "UNBOUND_IMAGE_VERSION=${{ steps.vars.outputs.UNBOUND_IMAGE_VERSION }}"

  build:
    if: github.actor == 'renovate[bot]' || github.event_name == 'workflow_dispatch'
    needs: buildvars
    runs-on: ${{ matrix.runner }}
    
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            platform: linux/amd64
            runner: ubuntu-latest
          - arch: 386
            platform: linux/386
            runner: ubuntu-latest
            
          - arch: arm64
            platform: linux/arm64
            runner: ubuntu-24.04-arm
          - arch: armv6
            platform: linux/arm/v6
            runner: ubuntu-24.04-arm
          - arch: armv7
            platform: linux/arm/v7
            runner: ubuntu-24.04-arm
            
          - arch: riscv64
            platform: linux/riscv64
            runner: ubuntu-24.04-riscv
            
          - arch: ppc64le
            platform: linux/ppc64le
            runner: ubuntu-latest
          - arch: s390x
            platform: linux/s390x
            runner: ubuntu-latest

    env:
      DOCKERHUB_SLUG: "madnuttah/unbound"

    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: block
          allowed-endpoints: >
            auth.docker.io:443
            dl-cdn.alpinelinux.org:443
            github.com:443
            keyserver.ubuntu.com:443
            pgp.surf.nl:443
            nlnetlabs.nl:443
            production.cloudfront.docker.com:443
            registry-1.docker.io:443
            www.internic.net:443
            www.nlnetlabs.nl:443

      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          persist-credentials: false
          fetch-depth: 0

      - uses: docker/setup-qemu-action@06116385d9baf250c9f4dcb4858b16962ea869c3

      - uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee
        if: github.event_name != 'pull_request'
        with:
          username: "${{ secrets.DOCKERHUB_USERNAME }}"
          password: "${{ secrets.DOCKERHUB_TOKEN }}"

      - name: Build and push Unbound image
        run: |
          set -euo pipefail

          BUILDER_NAME="isolated-builder-${{ github.run_id }}-${{ matrix.arch }}"
          IMAGE_TAG="${{ env.DOCKERHUB_SLUG }}:${{ needs.buildvars.outputs.UNBOUND_IMAGE_VERSION }}-${{ matrix.arch }}"

          BUILD_TIMEOUT=2700
          LOG_FILE="/tmp/build_output_${{ matrix.arch }}.log"

          echo ">>> Creating builder: ${BUILDER_NAME}"
          if ! docker buildx create \
            --name "${BUILDER_NAME}" \
            --driver docker-container \
            --bootstrap \
            --use; then
            echo "ERROR: Failed to create buildx builder for ${BUILDER_NAME}"
            exit 1
          fi

          echo ">>> Building for platform: ${{ matrix.platform }}"

          if ! timeout "${BUILD_TIMEOUT}" docker buildx build \
            --builder "${BUILDER_NAME}" \
            --file unbound/release.Dockerfile \
            --platform "${{ matrix.platform }}" \
            --push \
            --no-cache \
            --build-arg IMAGE_BUILD_DATE="${{ needs.buildvars.outputs.IMAGE_BUILD_DATE }}" \
            --build-arg UNBOUND_VERSION="${{ needs.buildvars.outputs.UNBOUND_VERSION }}" \
            --build-arg UNBOUND_SHA256="${{ needs.buildvars.outputs.UNBOUND_SHA256 }}" \
            --build-arg UNBOUND_DOCKER_IMAGE_VERSION="${{ needs.buildvars.outputs.UNBOUND_IMAGE_VERSION }}" \
            --build-arg OPENSSL_BUILDENV_VERSION="${{ needs.buildvars.outputs.OPENSSL_BUILDENV_VERSION }}" \
            --tag "${IMAGE_TAG}" \
            --provenance=false \
            --sbom=false \
            . 2>&1 | tee "${LOG_FILE}"; then

            EXIT_CODE=${PIPESTATUS[0]}

            if [ "${EXIT_CODE}" -eq 124 ]; then
              echo "ERROR: Build timed out after ${BUILD_TIMEOUT} seconds for ${{ matrix.platform }}"
              echo ">>> This indicates the build process hung or was stuck on a network request."
            else
              echo "ERROR: Build command failed with exit code ${EXIT_CODE}"
              echo ">>> Last 50 lines of build output:"
              tail -n 50 "${LOG_FILE}"
            fi

            docker buildx rm "${BUILDER_NAME}" || true
            exit 1
          fi

          echo ">>> Build command completed. Verifying push..."

          if ! docker pull --quiet "${IMAGE_TAG}" &>/dev/null; then
            echo "ERROR: Image push failed - image not found on registry: ${IMAGE_TAG}"
            docker buildx rm "${BUILDER_NAME}" || true
            exit 1
          fi

          echo "Image verified on registry: ${IMAGE_TAG}"
          echo ">>> Build and push succeeded for ${{ matrix.platform }}"
          docker buildx rm "${BUILDER_NAME}" || true

  upload-pipeline-metadata:
    needs: [buildvars, build]
    if: always()
    runs-on: ubuntu-latest

    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: block
          allowed-endpoints: >
            api.github.com:443
            github.com:443
            actions.githubusercontent.com:443

      - name: Create Isolated Metadata
        run: |
          set -euo pipefail
          mkdir -p metadata-payload
          printf "%s" "${{ needs.buildvars.outputs.UNBOUND_IMAGE_VERSION }}" > metadata-payload/version.txt
          printf "stable" > metadata-payload/variant.txt

      - name: Upload Metadata Artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: unbound-build-metadata
          path: metadata-payload/
          retention-days: 1

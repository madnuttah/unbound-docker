name: CD Increment Unbound Subversions

on:
  pull_request_target:
    types: [opened, synchronize, reopened]
    branches:
      - main
    paths:
      - versions/unbound.txt
      - versions/openssl-buildenv.txt
      - versions/openssl-quic-buildenv.txt

concurrency:
  group: bump-subversions-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  bump-sub:
    if: >-
      github.event.pull_request.head.repo.fork == false &&
      github.event.pull_request.user.login == 'renovate[bot]'
    runs-on: ubuntu-latest

    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411
        with:
          egress-policy: block
          allowed-endpoints: >
            api.github.com:443
            github.com:443

      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: true
          repository: ${{ github.repository }}
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Import GPG Key
        id: import_gpg
        uses: crazy-max/ghaction-import-gpg@2dc316deee8e90f13e1a351ab510b4d5bc0c82cd # v7
        with:
          gpg_private_key: ${{ secrets.BOT_GPG_PRIVATE_KEY }}
          passphrase: ${{ secrets.BOT_GPG_PASSPHRASE }}
          git_user_signingkey: true
          git_commit_gpgsign: true
          git_tag_gpgsign: true
          git_push_gpgsign: false
          trust_level: 4
        env:
          GITHUB_TOKEN: ${{ secrets.BOT_GITHUB_TOKEN }}
          GH_TOKEN: ${{ secrets.BOT_GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.x'

      - name: Update generated image metadata
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          GITHUB_TOKEN: ${{ secrets.BOT_GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          git remote set-url origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${{ github.repository }}"
          git fetch --no-tags --prune origin "${BASE_REF}"

          python3 <<'PY'
          import os
          import re
          import subprocess
          import sys

          UNBOUND_FILE = "versions/unbound.txt"
          OPENSSL_FILE = "versions/openssl-buildenv.txt"
          OPENSSL_QUIC_FILE = "versions/openssl-quic-buildenv.txt"
          IMAGE_FILE = "versions/unbound-docker-image.txt"
          IMAGE_QUIC_FILE = "versions/unbound-quic-docker-image.txt"

          def read(path):
              with open(path, "r", encoding="utf-8") as fh:
                  return fh.read().strip()

          def write(path, content):
              with open(path, "w", encoding="utf-8") as fh:
                  fh.write(content)

          def parse_unbound_version(value):
              m = re.fullmatch(r"(\d+)\.(\d+)\.(\d+)", value)
              if not m:
                  raise ValueError(f"Invalid unbound version: {value!r}")
              return tuple(int(x) for x in m.groups())

          def parse_image_version(value, *, quic=False):
              pattern = r"^unbound=(\d+\.\d+\.\d+)-(\d+)(-quic)?$"
              m = re.fullmatch(pattern, value)
              if not m:
                  raise ValueError(f"Invalid image version: {value!r}")
              base, sub, suffix = m.groups()
              if quic and not suffix:
                  raise ValueError(f"Expected quic suffix in image version: {value!r}")
              if (not quic) and suffix:
                  raise ValueError(f"Unexpected quic suffix in non-quic image version: {value!r}")
              return base, int(sub), suffix or ""

          def reset_image(path, base_version, *, quic=False):
              suffix = "-quic" if quic else ""
              new_value = f"unbound={base_version}-0{suffix}"
              write(path, new_value + "\n")

          def increment_image(path, *, quic=False):
              value = read(path)
              base, sub, suffix = parse_image_version(value, quic=quic)
              new_value = f"unbound={base}-{sub + 1}{'-quic' if quic else ''}"
              write(path, new_value + "\n")

          def changed_files(base_ref):
              try:
                  subprocess.run(
                      ["git", "fetch", "origin", base_ref],
                      check=True,
                      capture_output=True,
                      text=True,
                      timeout=30,
                  )
                  proc = subprocess.run(
                      ["git", "diff", "--name-only", f"origin/{base_ref}...HEAD"],
                      check=True,
                      capture_output=True,
                      text=True,
                      timeout=30,
                  )
                  return [line.strip() for line in proc.stdout.splitlines() if line.strip()]
              except Exception as exc:
                  print(f"WARNING: unable to compute diff: {exc}")
                  return []

          base_ref = os.environ.get("BASE_REF", "main")
          files = changed_files(base_ref)
          print(f"Changed files: {files}")

          unbound_changed = UNBOUND_FILE in files
          openssl_changed = OPENSSL_FILE in files
          openssl_quic_changed = OPENSSL_QUIC_FILE in files

          if not (unbound_changed or openssl_changed or openssl_quic_changed):
              print("No relevant version file change. Nothing to do.")
              sys.exit(0)

          if unbound_changed:
              new_unbound = read(UNBOUND_FILE).strip()
              parse_unbound_version(new_unbound)
              reset_image(IMAGE_FILE, new_unbound, quic=False)
              reset_image(IMAGE_QUIC_FILE, new_unbound, quic=True)
              print(f"Unbound bumped to {new_unbound}; reset subversions to 0.")

          if openssl_changed:
              increment_image(IMAGE_FILE, quic=False)
              print("OpenSSL non-QUIC file changed; incremented non-QUIC image subversion.")

          if openssl_quic_changed:
              increment_image(IMAGE_QUIC_FILE, quic=True)
              print("OpenSSL QUIC file changed; incremented QUIC image subversion.")
          PY

      - name: Commit and push generated metadata
        env:
          GITHUB_TOKEN: ${{ secrets.BOT_GITHUB_TOKEN }}
          GIT_AUTHOR_NAME: ${{ steps.import_gpg.outputs.name }}
          GIT_AUTHOR_EMAIL: ${{ steps.import_gpg.outputs.email }}
          GIT_COMMITTER_NAME: ${{ steps.import_gpg.outputs.name }}
          GIT_COMMITTER_EMAIL: ${{ steps.import_gpg.outputs.email }}
        run: |
          set -euo pipefail

          git config --local user.name "${GIT_AUTHOR_NAME}"
          git config --local user.email "${GIT_AUTHOR_EMAIL}"
          git config --local commit.gpgsign true

          git add versions/unbound-docker-image.txt versions/unbound-quic-docker-image.txt

          if git diff --staged --quiet; then
            echo "No real changes to commit."
            exit 0
          fi

          git commit -m "fix: sync docker image subversion metadata"
          git push origin "HEAD:${{ github.event.pull_request.head.ref }}"
          echo "Updated generated Docker metadata on the Renovate PR branch."

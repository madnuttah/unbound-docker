name: CD Increment Unbound Subversions

on:
  pull_request:
    types: [opened, synchronize]
    branches:
      - main
    paths:
      - versions/unbound.txt
      - versions/openssl-buildenv.txt
      - versions/openssl-quic-buildenv.txt

permissions:
  contents: write

jobs:
  bump-sub:
    if: github.event.sender.login == 'renovate[bot]'
    
    runs-on: ubuntu-latest

    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411
        with:
          egress-policy: audit
                    
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: true
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Import GPG key
        id: IMPORT_GPG
        uses: crazy-max/ghaction-import-gpg@2dc316deee8e90f13e1a351ab510b4d5bc0c82cd # v7
        with:
          gpg_private_key: ${{ secrets.BOT_GPG_PRIVATE_KEY }}
          passphrase: ${{ secrets.BOT_GPG_PASSPHRASE }}
          git_user_signingkey: true
          git_commit_gpgsign: true
          git_tag_gpgsign: false
          git_push_gpgsign: false
          trust_level: 5

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.x'

      - name: Process Subversion Logic
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          PR_BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          python3 << 'PYTHON_SCRIPT'
          import re
          import os
          import sys
          import subprocess
          from typing import Tuple, Optional

          def update_docker_image_file(filepath: str, target_version: str) -> bool:
              """Update the docker image file to the target version and reset subversion to 0."""
              if not os.path.exists(filepath):
                  print(f"File not found: {filepath}")
                  return False

              with open(filepath, 'r', encoding='utf-8') as f:
                  content = f.read().strip()

              match = re.search(r'unbound=(\d+\.\d+\.\d+)-(\d+)(-quic)?', content)
              if not match:
                  print(f"ERROR: No version pattern found in {filepath}")
                  return False

              old_base = match.group(1)
              old_sub = int(match.group(2))
              suffix = match.group(3) or ""

              new_version = f"unbound={target_version}-0{suffix}"

              with open(filepath, 'w', encoding='utf-8') as f:
                  f.write(f"{new_version}\n")

              print(f"Updated {filepath}: {old_base}-{old_sub}{suffix} -> {new_version}")
              return True

          def modify_openssl(filepath: str, is_quic: bool = False) -> bool:
              """Increment OpenSSL buildenv subversion by 1."""
              if not os.path.exists(filepath):
                  print(f"File not found: {filepath}")
                  return False

              with open(filepath, 'r', encoding='utf-8') as f:
                  content = f.read().strip()

              if is_quic:
                  match = re.search(r'OPENSSL_QUIC_BUILDENV_VERSION=(\d+\.\d+\.\d+)-(\d+)-quic', content)
              else:
                  match = re.search(r'OPENSSL_BUILDENV_VERSION=(\d+\.\d+\.\d+)-(\d+)$', content)

              if not match:
                  print(f"No version pattern found in {filepath}")
                  return False

              base = match.group(1)
              old_sub = int(match.group(2))
              new_sub = old_sub + 1
              suffix = "-quic" if is_quic else ""

              new_version = f"{'OPENSSL_QUIC_BUILDENV_VERSION' if is_quic else 'OPENSSL_BUILDENV_VERSION'}={base}-{new_sub}{suffix}"

              with open(filepath, 'w', encoding='utf-8') as f:
                  f.write(f"{new_version}\n")

              print(f"Updated {filepath}: {base}-{old_sub}{suffix} -> {base}-{new_sub}{suffix}")
              return True

          def get_changed_files() -> list:
              """Get files changed compared to main branch base SHA."""
              try:
                  base_ref = os.environ.get('BASE_REF', 'main')
                  result = subprocess.run(
                      ["git", "fetch", "origin", base_ref],
                      capture_output=True,
                      text=True,
                      check=False,
                      timeout=30
                  )
                  if result.returncode != 0:
                      print(f"Warning: git fetch failed: {result.stderr}")

                  result = subprocess.run(
                      ["git", "diff", "--name-only", f"origin/{base_ref}...HEAD"],
                      capture_output=True,
                      text=True,
                      check=False,
                      timeout=30
                  )
                  if result.returncode != 0:
                      print(f"Warning: git diff failed: {result.stderr}")
                      return []

                  files = [f for f in result.stdout.strip().split('\n') if f]
                  return files
              except subprocess.TimeoutExpired:
                  print("Error: git command timed out")
                  return []
              except Exception as e:
                  print(f"Error: Could not get changed files: {e}")
                  return []

          def read_version_file(filepath: str) -> str:
              """Read version file content."""
              if not os.path.exists(filepath):
                  return ""
              with open(filepath, 'r', encoding='utf-8') as f:
                  return f.read().strip()

          print("=" * 60)
          print("Processing Subversion Logic")
          print("=" * 60)

          changed = False
          changed_files = get_changed_files()

          unbound_changed = "versions/unbound.txt" in changed_files
          openssl_changed = "versions/openssl-buildenv.txt" in changed_files
          openssl_quic_changed = "versions/openssl-quic-buildenv.txt" in changed_files

          print(f"Changed files: {changed_files}\n")

          new_unbound_version = read_version_file("versions/unbound.txt")
          if not new_unbound_version:
              print("ERROR: versions/unbound.txt not found or empty")
              sys.exit(1)

          print(f"Target Unbound version: {new_unbound_version}\n")

          if unbound_changed:
              print(">>> UNBOUND CHANGED")
              print("Syncing docker image files and resetting OpenSSL subversions to 0.\n")
              
              if update_docker_image_file('versions/unbound-docker-image.txt', new_unbound_version):
                  changed = True
              if update_docker_image_file('versions/unbound-quic-docker-image.txt', new_unbound_version):
                  changed = True
              if modify_openssl('versions/openssl-buildenv.txt', is_quic=False):
                  changed = True
              if modify_openssl('versions/openssl-quic-buildenv.txt', is_quic=True):
                  changed = True
          else:
              if openssl_changed:
                  print(">>> OPENSSL BUILDENV CHANGED")
                  print("Incrementing subversion by 1\n")
                  if modify_openssl('versions/openssl-buildenv.txt', is_quic=False):
                      changed = True

              if openssl_quic_changed:
                  print(">>> OPENSSL QUIC BUILDENV CHANGED")
                  print("Incrementing subversion by 1\n")
                  if modify_openssl('versions/openssl-quic-buildenv.txt', is_quic=True):
                      changed = True

          print("=" * 60)

          if not changed:
              print("No changes were made.")
              with open(os.environ['GITHUB_ENV'], 'a', encoding='utf-8') as f:
                  f.write("HAS_CHANGES=false\n")
              sys.exit(0)
          else:
              print("Changes detected. Will commit and push.")
              with open(os.environ['GITHUB_ENV'], 'a', encoding='utf-8') as f:
                  f.write("HAS_CHANGES=true\n")
          PYTHON_SCRIPT

      - name: Export PR branch
        env:
          PR_BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          echo "PR_BRANCH=${PR_BRANCH}" >> "${GITHUB_ENV}"

      - name: Commit and Push Changes
        if: env.HAS_CHANGES == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.BOT_GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          git remote set-url origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${{ github.repository }}.git"

          git config --local user.name "${{ steps.IMPORT_GPG.outputs.name }}"
          git config --local user.email "${{ steps.IMPORT_GPG.outputs.email }}"
          
          echo "Fetching latest state of ${PR_BRANCH}..."
          git fetch --force origin "${PR_BRANCH}"
          
          git add versions/*.txt
          
          if git diff --staged --quiet; then
            echo "No real differences to commit."
          else
            git commit -m "fix: auto-manage unbound subversion"
            git push origin "HEAD:${PR_BRANCH}"
          fi
